[project]
name = "aim-migrate"
version = "0.7.1"
description = "AIM — Agent Identity Migration: harness- and OS-agnostic AI agent state migration (Samsung Smart Switch for AI agents)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "click>=8.0",
    "cryptography>=41.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
aim = "aim.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
